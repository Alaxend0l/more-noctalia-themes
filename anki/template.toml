# Noctalia community template: Anki
# Layout follows https://github.com/noctalia-dev/community-templates

[catalog.anki]
name = "Anki"
category = "misc"

# Anki's whole web UI (deck picker, browser, reviewer chrome, editor, stats)
# is driven by CSS custom properties (--canvas, --fg, --button-*, --flag-*,
# --state-*, ...). The webcss entry redefines that variable set at :root.
# Qt window chrome (menus, tooltips, dialogs, scrollbars) is covered by QSS.
# Both files are consumed by a minimal companion add-on (addon/) that only
# reads them at startup - no timers, no live reload; new colors take effect
# at the next Anki start, same lifecycle as the browser templates.

[templates.webcss]
input_path          = "noctalia-web.css"
output_path_dynamic = "bash '{{ config_dir }}/find_anki_dirs.sh' noctalia.css"
post_hook           = "bash '{{ config_dir }}/install_addon.sh'"
undo_hook           = "bash '{{ config_dir }}/uninstall_addon.sh'"
hook_async          = false

[templates.qtqss]
input_path          = "noctalia-qt.qss"
output_path_dynamic = "bash '{{ config_dir }}/find_anki_dirs.sh' noctalia.qss"
post_hook           = "bash '{{ config_dir }}/install_addon.sh'"
undo_hook           = "bash '{{ config_dir }}/uninstall_addon.sh'"
hook_async          = false
