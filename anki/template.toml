# Noctalia community template: Anki
# Layout follows https://github.com/noctalia-dev/community-templates

[catalog.anki]
name = "Anki"
category = "misc"

# Anki keeps three colour layers, and the template feeds all of them:
#  - noctalia_colors.json  Anki's own colour roles (aqt.colors), which it uses
#    to generate its Qt stylesheet, QPalette, themed toolbar icons and the
#    custom-painted Cards/Notes switch
#  - noctalia.css          CSS custom properties for the web views: Anki's
#    --canvas/--fg/--button-*/--flag-*/--state-* set plus Bootstrap's --bs-* set
#  - noctalia.qss          extra QSS appended after Anki's for the Qt chrome
# All three are consumed by a minimal companion add-on (addon/) that only
# reads them at startup - no timers, no live reload; new colors take effect
# at the next Anki start, same lifecycle as the browser templates.

[templates.colorjson]
input_path          = "noctalia-colors.json"
output_path_dynamic = "bash '{{ config_dir }}/find_anki_dirs.sh' noctalia_colors.json"
post_hook           = "bash '{{ config_dir }}/install_addon.sh'"
undo_hook           = "bash '{{ config_dir }}/uninstall_addon.sh'"
hook_async          = false

[templates.webcss]
input_path          = "noctalia-web.css"
output_path_dynamic = "bash '{{ config_dir }}/find_anki_dirs.sh' noctalia.css"
post_hook           = "bash '{{ config_dir }}/install_addon.sh'"
undo_hook           = "bash '{{ config_dir }}/uninstall_addon.sh'"
hook_async          = false

[templates.qtqss]
input_path          = "noctalia-qt.qss"
output_path_dynamic = "bash '{{ config_dir }}/find_anki_dirs.sh' noctalia.qss"
post_hook           = "bash '{{ config_dir }}/install_addon.sh'"
undo_hook           = "bash '{{ config_dir }}/uninstall_addon.sh'"
hook_async          = false
