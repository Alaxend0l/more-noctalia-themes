# Rendered by Noctalia; consumed by apply.sh — NOT read by Kdenlive.
# One entry per line: <group> <key> <value>. '#' lines are comments.
# Clip tints use Kdenlive's #AARRGGBB convention (alpha first, as in its own
# defaults, where #00000000 means "follow the palette"). The 4D (~30%) alpha
# keeps clips a tint over the track background instead of a flat block.

unmanaged videoColor #4D{{ colors.primary_container.default.hex_stripped }}
unmanaged audioColor #4D{{ colors.secondary_container.default.hex_stripped }}
unmanaged titleColor #4D{{ colors.tertiary_container.default.hex_stripped }}
unmanaged imageColor #4D{{ colors.surface_container_high.default.hex_stripped }}
unmanaged slideshowColor #4D{{ colors.surface_container_highest.default.hex_stripped }}
unmanaged colorclipcolor {{ colors.surface_container_high.default.hex }}
unmanaged thumbColor1 {{ colors.secondary.default.hex }}
unmanaged thumbColor2 {{ colors.tertiary.default.hex }}
unmanaged overlayColor {{ colors.primary.default.hex }}
sdl window_background {{ colors.surface_container.default.hex }}
UiSettings ColorScheme noctalia
